<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}<span class="cursor">_</span></a>
    <nav class="site-nav">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" {{ if eq .URL $.RelPermalink }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
